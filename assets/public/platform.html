<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>出行查询</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --brand:#1a7ae0; --brand-d:#0f5cb5; --ink:#1d2433; --muted:#6b7689;
    --line:#e3e9f2; --bg:#f4f7fb; --ok:#129d74; --warn:#d97706; --card:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.7 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}

  /* 顶栏 */
  .top{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:14px 20px}
  .top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:26px;height:26px;border-radius:8px;background:#fff;color:var(--brand);
             display:grid;place-items:center;font-size:16px}
  .trip{margin-left:auto;background:rgba(255,255,255,.16);border-radius:10px;
        padding:6px 14px;font-size:14.5px;font-weight:700}

  /* 搜索条 */
  .bar{background:#fff;border-bottom:1px solid var(--line)}
  .bar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;
          align-items:center;flex-wrap:wrap;font-size:14.5px}
  .bar b{color:var(--brand-d)}
  .tag{background:#eef4ff;color:var(--brand-d);border-radius:8px;padding:4px 12px;font-weight:700}

  .wrap{max-width:1080px;margin:0 auto;padding:18px 20px 40px}
  h2.sec{font-size:17.5px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  h2.sec:first-child{margin-top:4px}
  h2.sec .n{background:var(--brand);color:#fff;border-radius:7px;font-size:13px;
            padding:2px 9px;font-weight:800}

  /* 结果卡 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
  .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tm{font-size:24px;font-weight:900;line-height:1.15;letter-spacing:.5px}
  .tm small{display:block;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
  .mid{flex:1 1 150px;text-align:center;color:var(--muted);font-size:13px;min-width:120px}
  .mid .line{height:1px;background:var(--line);margin:6px 0;position:relative}
  .mid .line::after{content:'▸';position:absolute;right:-4px;top:-9px;color:var(--brand)}
  .no{background:#eef4ff;color:var(--brand-d);border-radius:7px;padding:2px 10px;
      font-weight:800;font-size:14px;display:inline-block}
  .price{font-size:21px;font-weight:900;color:#e2564a;white-space:nowrap}
  .price small{font-size:13px;font-weight:600}

  /* 通用信息表 */
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
        border-radius:12px;overflow:hidden}
  th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f7f9fd;color:var(--muted);font-weight:700;width:112px;white-space:nowrap}
  tr:last-child th,tr:last-child td{border-bottom:0}
  .big{font-size:18px;font-weight:800}
  .money{color:#e2564a;font-weight:800}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .item .nm{font-weight:800;font-size:15.5px;margin-bottom:4px}
  .item .sub{color:var(--muted);font-size:13.5px}
  .item .p{color:#e2564a;font-weight:800;margin-top:6px}

  .note{background:#fff8ec;border:1px solid #f5dfb8;color:#8a5a12;
        border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14.5px}
  .note b{color:#a4620d}

  /* 配图 */
  .thumb{width:100%;aspect-ratio:5/3;object-fit:cover;display:block;
         border-radius:10px;background:#e8edf5}
  .card .thumb,.item .thumb{margin-bottom:10px}
  .rowimg{width:132px;height:80px;object-fit:cover;border-radius:10px;flex:0 0 auto;background:#e8edf5}
  .hero{width:100%;max-height:230px;object-fit:cover;border-radius:14px;display:block;margin-bottom:12px}

  /* ★ 关键信息区：学生截这一块就够贴进行程卡 ★ */
  .snap{border:3px solid var(--brand);border-radius:16px;background:#fff;
        margin:4px 0 18px;overflow:hidden;box-shadow:0 6px 22px rgba(26,122,224,.13)}
  .snap-hd{background:var(--brand);color:#fff;padding:9px 16px;font-size:15px;font-weight:800;
           display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .snap-wrap{display:flex;align-items:stretch}
  .snap-pic{flex:0 0 230px;width:230px;object-fit:cover;display:block;
            border-right:1px solid var(--line);background:#e8edf5;align-self:stretch}
  .snap-bd{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:0;min-width:0}
  .snap-bd .kv{display:flex;border-bottom:1px solid var(--line);min-width:0}
  .snap-bd .kv:nth-child(odd){border-right:1px solid var(--line)}
  .snap-bd .k{flex:0 0 92px;background:#f7f9fd;color:var(--muted);padding:9px 12px;
              font-size:13.5px;font-weight:700}
  .snap-bd .v{flex:1 1 auto;padding:9px 12px;font-size:15px;font-weight:700;color:var(--ink);
              word-break:break-all}
  .snap-bd .v em{font-style:normal;color:#e2564a}
  .snap-ft{padding:8px 16px;background:#f7f9fd;color:var(--muted);font-size:12.5px}

  /* 下面每一项都可点，点了就顶到上面的关键信息区 */
  .sel{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .08s;position:relative}
  .sel:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(26,122,224,.16)}
  .sel:active{transform:translateY(1px)}
  .sel.on{border-color:var(--brand);border-width:2px;box-shadow:0 0 0 3px rgba(26,122,224,.16)}
  .sel.on::after{content:'已选';position:absolute;top:-9px;right:12px;background:var(--brand);
                 color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 9px}
  .pickhint{color:var(--muted);font-size:13px;margin:-2px 0 10px}
  @media (max-width:760px){
    .snap-wrap{display:block}
    .snap-pic{width:100%;flex:none;height:150px;border-right:0;border-bottom:1px solid var(--line)}
    .snap-bd{grid-template-columns:1fr}
    .snap-bd .kv:nth-child(odd){border-right:0}
  }

  /* 来源：这节课的重点——信息要看是谁说的 */
  .src{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
       color:var(--muted);font-size:12.5px}
  .src b{color:var(--ok)}
  .foot{margin-top:26px;padding:14px;background:#eef4ff;border-radius:12px;
        color:var(--brand-d);font-size:13.5px;line-height:1.8}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  @media (max-width:640px){
    .tm{font-size:20px} .wrap{padding:14px}
  }
</style>
</head>
<body>
  <div class="top"><div class="top-in">
    <div class="logo"><span class="dot">查</span>出行查询</div>
    <div class="trip" id="trip">—</div>
  </div></div>
  <div class="bar"><div class="bar-in" id="bar">—</div></div>
  <div class="wrap" id="wrap"><div class="empty">加载中…</div></div>

<script src="/platform-data.js"></script>
<script>
(function(){
  var D = window.PLATFORM_DATA || {};
  var q = new URLSearchParams(location.search);
  var role = q.get('role') || '';
  var kind = q.get('kind') || '';      // train / sight / hotel / rest（来自 course.js 的 platformKind）
  var team = q.get('team') || '';
  var city = q.get('city') || '';
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  document.getElementById('trip').textContent =
    (D.meta && D.meta.date ? D.meta.date : '') + ' · ' + (D.meta && D.meta.nights ? D.meta.nights : '');
  document.getElementById('bar').innerHTML =
    '<span class="tag">' + esc(role || '岗位') + '</span>' +
    '出发地 <b>' + esc((D.meta&&D.meta.from)||'—') + '</b>　→　目的地 <b>' + esc(city||'—') + '</b>' +
    (team ? '　·　<b>' + esc(team) + '</b>' : '');

  var IMG = function(slug, cls){
    return slug ? '<img class="' + (cls||'thumb') + '" src="/platform-img/' + esc(slug) + '.jpg" alt="" />' : '';
  };
  /* 关键信息区：一张图 + 整齐的键值表，学生截这一块就能照着填行程卡 */
  function snapBox(title, rows, foot, img){
    return '<div class="snap"><div class="snap-hd">📋 ' + esc(title) + '</div>' +
      '<div class="snap-wrap">' +
      (img ? '<img class="snap-pic" src="/platform-img/' + esc(img) + '.jpg" alt="" />' : '') +
      '<div class="snap-bd">' +
      rows.map(function(r){
        return '<div class="kv"><div class="k">' + esc(r[0]) + '</div><div class="v">' + r[1] + '</div></div>';
      }).join('') + '</div></div>' +
      (foot ? '<div class="snap-ft">' + foot + '</div>' : '') + '</div>';
  }
  function srcLine(src, asof){
    if(!src) return '';
    return '<div class="src">📌 信息来源：<b>' + esc(src) + '</b>' +
      (asof ? '　·　查询日期：' + esc(asof) : '') + '</div>';
  }
  function trainCard(t, i){
    return '<div class="card sel"' + (i===undefined?'':pick(i)) + '><div class="row">' +
      '<div class="tm">' + esc(t.dep) + '<small>' + esc(t.fromSt) + '</small></div>' +
      '<div class="mid"><span class="no">' + esc(t.no) + '</span><div class="line"></div>' +
        esc(t.dur||'') + (t.type?'　'+esc(t.type):'') + '</div>' +
      '<div class="tm">' + esc(t.arr) + '<small>' + esc(t.toSt) + '</small></div>' +
      '<div class="price">' + (t.price ? '¥' + esc(t.price) + '<small> 起</small>' : '<small style="color:#6b7689">票价待查</small>') + '</div>' +
      '</div></div>';
  }
  function kv(rows){
    return '<table>' + rows.map(function(r){
      return '<tr><th>' + esc(r[0]) + '</th><td>' + r[1] + '</td></tr>';
    }).join('') + '</table>';
  }

  var H = '';
  var asof = (D.meta && D.meta.asof) || '';
  /* 品牌名来自 platform-data.js 的 meta.title（没写就用"出发地 · 出行查询"） */
  var BRAND = (D.meta && D.meta.title) || (((D.meta && D.meta.from) || '') + ' · 出行查询').replace(/^ · /, '');
  document.title = BRAND;
  var logoEl = document.querySelector('.top .logo');
  if(logoEl) logoEl.innerHTML = '<span class="dot">' + esc(BRAND.slice(0,1)) + '</span>' + esc(BRAND);
  /* 下面每一项都可以点：点了就顶到上面的关键信息区，方便学生截自己选的那一个 */
  var OPTS = [], SEL = -1, DEF = null;
  var SNAPZONE = '<div id="snapzone"></div>';
  function opt(o){ OPTS.push(o); return OPTS.length - 1; }
  function pick(i){ return ' data-opt="' + i + '"'; }

  if(kind === 'train' || (!kind && /交通/.test(role))){
    var tr = (D.traffic||{})[city];
    if(!tr) H = '<div class="empty">这个城市的交通数据还没录入。</div>';
    else{
      var sn = ((D.snap||{}).traffic||{})[city];
      // 东营推荐的是大巴，配图就用大巴；其余用高铁
      var snImg = /大巴/.test((sn||[]).map(function(r){return r[1];}).join('')) ? tr.imgBus : tr.imgTrain;
      if(sn) DEF = {title:((D.meta&&D.meta.from)||'') + ' → ' + city + '　推荐方案', img:snImg,
        foot:'出行日期：' + esc((D.meta&&D.meta.date)||''),
        rows: sn.map(function(r){
          return [r[0], /¥|\d+ 元/.test(r[1]) ? '<em>' + esc(r[1]) + '</em>' : esc(r[1])];
        })};
      H += SNAPZONE;
      if(tr.note) H += '<div class="note">⚠️ ' + tr.note + '</div>';
      if(tr.direct && tr.direct.length){
        H += '<h2 class="sec"><span class="n">直达</span>火车 / 高铁</h2>' +
             IMG(tr.imgTrain, 'hero') + tr.direct.map(function(t){
          return trainCard(t, opt({title:'火车 · ' + t.no, img:tr.imgTrain,
            foot:'出行日期：' + esc((D.meta&&D.meta.date)||''),
            rows:[['车次', esc(t.no)], ['出发', esc(t.fromSt) + '　' + esc(t.dep)],
                  ['到达', esc(t.toSt) + '　' + esc(t.arr)], ['历时', esc(t.dur||'')],
                  ['二等座', t.price ? '<em>¥' + esc(t.price) + '</em>' : '—'],
                  ['类型', esc(t.type||'')]]}));
        }).join('');
      }
      if(tr.transfer && tr.transfer.length){
        H += '<h2 class="sec"><span class="n">中转</span>需要换乘</h2>';
        H += tr.transfer.map(function(x){
          var legs = x.legs || [];
          var i = opt({title:'中转 · ' + x.title, img:tr.imgTrain,
            foot:'出行日期：' + esc((D.meta&&D.meta.date)||''),
            rows:[['方案', esc(x.title)], ['换乘站', esc(x.via||'')],
                  ['第一程', legs[0] ? esc(legs[0].no) + '　' + esc(legs[0].dep) + '→' + esc(legs[0].arr) : '—'],
                  ['第二程', legs[1] ? esc(legs[1].no) + '　' + esc(legs[1].dep) + '→' + esc(legs[1].arr) : '—'],
                  ['全程', '<em>' + esc(x.total||'') + '</em>']]});
          return '<div class="card sel"' + pick(i) + '><div class="big">' + esc(x.title) + '</div>' +
            '<div style="color:#6b7689;font-size:14px;margin:4px 0 8px">全程约 ' + esc(x.total||'—') +
            '　·　在 <b>' + esc(x.via||'—') + '</b> 换乘</div>' +
            (x.legs||[]).map(function(l){
              return '<div style="padding:6px 0;border-top:1px solid #e3e9f2">' +
                '<span class="no">' + esc(l.no) + '</span> ' + esc(l.fromSt) + ' ' + esc(l.dep) +
                ' → ' + esc(l.toSt) + ' ' + esc(l.arr) +
                (l.price ? '　<span class="money">¥' + esc(l.price) + '</span>' : '') + '</div>';
            }).join('') + '</div>';
        }).join('');
      }
      if(tr.bus && tr.bus.length){
        H += '<h2 class="sec"><span class="n">汽车</span>长途客车</h2>' + IMG(tr.imgBus, 'hero');
        if(tr.busNote) H += '<div class="note">' + tr.busNote + '</div>';
        H += '<div class="grid">' + tr.bus.map(function(b){
          var i = opt({title:'长途大巴 · ' + b.dep, img:tr.imgBus,
            foot:'出行日期：' + esc((D.meta&&D.meta.date)||''),
            rows:[['方式', '长途大巴'], ['发车', esc(b.dep)],
                  ['上车点', esc(b.station||'')], ['历时', esc(b.dur||'')],
                  ['票价', '<em>' + esc(b.price||'') + '</em>']]});
          return '<div class="item sel"' + pick(i) + '><div class="nm">' + esc(b.dep) + '</div>' +
            '<div class="sub">' + esc(b.station||'') + (b.dur ? '　' + esc(b.dur) : '') + '</div>' +
            (b.price ? '<div class="p">' + esc(b.price) + '</div>' : '') + '</div>';
        }).join('') + '</div>';
      }
      H += srcLine(tr.src, tr.asof || asof);
    }
  }
  else if(kind === 'sight' || (!kind && /景点/.test(role))){
    var s = (D.sights||{})[team];
    if(!s) H = '<div class="empty">这一组的景点数据还没录入。</div>';
    else{
      DEF = {title:s.name || '景点', img:s.img, foot:s.childTicket ? esc(s.childTicket) : '',
        rows:[['门票', '<em>' + esc(s.ticket||'') + '</em>'],
              ['开放时间', esc(s.hours||'')],
              ['详细地址', esc(s.addr||'')],
              ['建议游玩', esc(s.duration||'')]]};
      H += SNAPZONE;
      H += '<h2 class="sec"><span class="n">景点</span>' + esc(s.name||'') + '</h2>';
      H += kv([
        ['详细地址', esc(s.addr||'—')],
        ['门票', '<span class="money big">' + esc(s.ticket||'—') + '</span>' +
                 (s.childTicket ? '　儿童/学生：' + esc(s.childTicket) : '')],
        ['开放时间', '<span class="big">' + esc(s.hours||'—') + '</span>' +
                     (s.open ? '<div style="color:#6b7689;font-size:13.5px">' + esc(s.open) + '</div>' : '')],
        ['建议游玩', esc(s.duration||'—')],
        ['景区介绍', esc(s.intro||'—')],
        ['咨询电话', esc(s.tel||'—')],
      ]);
      H += srcLine(s.src, s.asof || asof);
    }
  }
  else if(kind === 'hotel' || (!kind && /住宿/.test(role))){
    var hb = (D.hotels||{})[city] || {};
    var hs = hb.list || [];
    if(!hs.length) H = '<div class="empty">这个城市的住宿数据还没录入。</div>';
    else{
      var top = hs[0];
      DEF = {title:esc(city) + ' 住宿 · 推荐', img:top.img, foot:top.dist ? esc(top.dist) : '',
        rows:[['酒店', esc(top.name)], ['价格', '<em>' + esc(top.price||'') + '</em>'],
              ['位置', esc(top.area||'')], ['档次', esc(top.level||'')]]};
      H += SNAPZONE;
      H += '<h2 class="sec"><span class="n">住宿</span>' + esc(city) + ' · ' +
           esc((D.meta&&D.meta.date)||'') + ' 入住</h2>';
      H += hs.map(function(h){
        var i = opt({title:h.name, img:h.img, foot:h.dist ? esc(h.dist) : '',
          rows:[['酒店', esc(h.name)], ['价格', '<em>' + esc(h.price||'') + '</em>'],
                ['位置', esc(h.area||'')], ['档次', esc(h.level||'')]]});
        return '<div class="card sel"' + pick(i) + '><div class="row">' +
          IMG(h.img, 'rowimg') +
          '<div style="flex:1 1 220px"><div class="big">' + esc(h.name) + '</div>' +
          '<div style="color:#6b7689;font-size:14px;margin-top:3px">' + esc(h.area||'') +
          (h.dist ? '　·　' + esc(h.dist) : '') + '</div>' +
          (h.note ? '<div style="color:#129d74;font-size:13.5px;margin-top:4px">✔ ' + esc(h.note) + '</div>' : '') +
          '</div>' +
          '<div style="text-align:right">' +
          (h.level ? '<div style="color:#6b7689;font-size:13px">' + esc(h.level) + '</div>' : '') +
          '<div class="price">' + esc(h.price||'—') + '</div></div>' +
          '</div></div>';
      }).join('');
      H += srcLine(hb.src, hb.asof || asof);
    }
  }
  else if(kind === 'rest' || (!kind && /美食/.test(role))){
    var f = (D.food||{})[city];
    if(!f) H = '<div class="empty">这个城市的美食数据还没录入。</div>';
    else{
      var ds = f.dishes || [], sps = f.shops || [];
      if(ds.length){
        DEF = {title:esc(city) + ' 美食 · 必吃推荐', img:ds[0].img,
          foot: sps[0] ? ('地址：' + esc(sps[0].area||'')) : '',
          rows:[['特色菜 1', esc(ds[0].name) + '　<em>' + esc(ds[0].price||'') + '</em>'],
                ['特色菜 2', ds[1] ? esc(ds[1].name) + '　<em>' + esc(ds[1].price||'') + '</em>' : '—'],
                ['推荐餐馆', sps[0] ? esc(sps[0].name) : '—'],
                ['人均', sps[0] ? '<em>' + esc(sps[0].perPerson||'') + '</em>' : '—']]};
        H += SNAPZONE;
        H += '<h2 class="sec"><span class="n">特色</span>' + esc(city) + ' 当地美食</h2>';
        H += '<div class="grid">' + ds.map(function(d){
          var i = opt({title:'特色美食 · ' + d.name, img:d.img, foot:esc(d.intro||''),
            rows:[['菜名', esc(d.name)], ['价格', '<em>' + esc(d.price||'') + '</em>'],
                  ['所在城市', esc(city)], ['推荐餐馆', sps[0] ? esc(sps[0].name) : '—']]});
          return '<div class="item sel"' + pick(i) + '>' + IMG(d.img) + '<div class="nm">' + esc(d.name) + '</div>' +
            '<div class="sub">' + esc(d.intro||'') + '</div>' +
            (d.price ? '<div class="p">' + esc(d.price) + '</div>' : '') + '</div>';
        }).join('') + '</div>';
      }
      if(sps.length){
        H += '<h2 class="sec"><span class="n">餐馆</span>去哪儿吃</h2>';
        H += sps.map(function(sp){
          var i = opt({title:sp.name, img:sp.img, foot:'地址：' + esc(sp.area||''),
            rows:[['餐馆', esc(sp.name)], ['人均', '<em>' + esc(sp.perPerson||'') + '</em>'],
                  ['招牌菜', esc(sp.signature||'')], ['所在城市', esc(city)]]});
          return '<div class="card sel"' + pick(i) + '><div class="row">' +
            IMG(sp.img, 'rowimg') +
            '<div style="flex:1 1 220px"><div class="big">' + esc(sp.name) + '</div>' +
            '<div style="color:#6b7689;font-size:14px;margin-top:3px">' + esc(sp.area||'') + '</div>' +
            (sp.signature ? '<div style="font-size:13.5px;margin-top:4px">招牌：' + esc(sp.signature) + '</div>' : '') +
            '</div><div class="price">' + esc(sp.perPerson||'—') + '</div></div></div>';
        }).join('');
      }
      H += srcLine(f.src, f.asof || asof);
    }
  }
  else{
    H = '<div class="empty">请先认领岗位。</div>';
  }

  H += '<div class="foot">💡 <b>信息会变</b>——票价、开放时间随时可能调整，真要出行还得去官网再确认一次。<br>' +
       '这也是今天要学的：<b>不管是 AI 说的还是网页上写的，都要看清楚是谁说的、什么时候说的。</b></div>';

  var wrap = document.getElementById('wrap');
  wrap.innerHTML = H;

  /* 点下面任意一项 → 顶到上面的关键信息区 */
  function drawSnap(){
    var o = (SEL >= 0 && OPTS[SEL]) ? OPTS[SEL] : DEF;
    var z = document.getElementById('snapzone');
    if(z && o) z.innerHTML = snapBox(o.title, o.rows, o.foot, o.img) +
      (OPTS.length ? '<div class="pickhint">👇 下面每一项都可以点，点哪个上面就换成哪个</div>' : '');
    var all = wrap.querySelectorAll('[data-opt]');
    for(var i=0;i<all.length;i++){
      if(+all[i].getAttribute('data-opt') === SEL) all[i].classList.add('on');
      else all[i].classList.remove('on');
    }
  }
  wrap.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-opt]') : null;
    if(!el) return;
    SEL = +el.getAttribute('data-opt');
    drawSnap();
    var z = document.getElementById('snapzone');
    if(z && z.scrollIntoView) z.scrollIntoView({behavior:'smooth', block:'start'});
  });
  drawSnap();
})();
</script>
</body>
</html>
